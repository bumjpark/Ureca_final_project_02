spring:
  application:
    name: myureca

  # ---------- MySQL ----------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:coupon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:coupon_user}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 커맨드 타임아웃을 명시하지 않으면 Lettuce 기본값(60s)이 적용돼, Redis가 죽었을 때
      # 요청 하나가 수십 초씩 블로킹된다. RedisConfig의 ClientOptions(REJECT_COMMANDS)와
      # 함께 "빠른 실패"를 강제하기 위한 짧은 타임아웃.
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 100
          min-idle: 20

  # ---------- Kafka ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coupon-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ---------- JPA Batch Insert (참고) ----------
  # CouponIssue, CouponHistory가 IDENTITY 전략을 사용 중이라 JDBC batch insert가 무력화됨.
  # 성능 개선 시 SEQUENCE 전략 전환 + 아래 설정 활성화 권장.
  # jpa:
  #   properties:
  #     hibernate:
  #       jdbc:
  #         batch_size: 30
  #       order_inserts: true
  #       order_updates: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 1000          # 동시 처리 스레드 수 1000개로 상향
      min-spare: 100     # 대기 스레드 100개 유지
    max-connections: 30000   # 동시 TCP 연결 30000개 수용
    accept-count: 10000      # 대기 큐 크기 10000개로 확장 (타임아웃 방어)
    connection-timeout: 20000

# ---------- Coupon Queue Settings ----------
coupon:
  queue:
    max-size: ${COUPON_QUEUE_MAX_SIZE:30000}
    token-ttl-seconds: ${COUPON_QUEUE_TOKEN_TTL:60}
    admission-rate: ${COUPON_QUEUE_ADMISSION_RATE:300}
    admission-interval-ms: ${COUPON_QUEUE_ADMISSION_INTERVAL_MS:1000}

# ---------- Coupon Kafka Consumer Settings ----------
# concurrency: 파티션 수와 반드시 일치시킬 것.
# 초과하면 일부 스레드가 파티션을 배정받지 못해 유휴 상태 + 순서 보장 깨짐.
# 확인 명령: kafka-topics.sh --describe --topic coupon-issued-events --bootstrap-server localhost:9092
  kafka:
    consumer:
      group-id: ${COUPON_KAFKA_CONSUMER_GROUP_ID:coupon-issue-consumer-group}
      concurrency: ${COUPON_KAFKA_CONSUMER_CONCURRENCY:3}

  # ---------- Redis 재구성(UBM-33) 운영 자동화 ----------
  redis-recovery:
    # RedisAutoRecoveryScheduler: 열려 있는 정책 중 stock 키가 없는 것을 이 주기로 찾아
    # 자동 recover 한다 (최초 오픈 초기화 + lag 실패 후 재시도 + 여러 정책 일괄 처리를 겸함).
    auto-interval-ms: ${COUPON_REDIS_RECOVERY_AUTO_INTERVAL_MS:5000}

# ---------- 인프라 헬스체크 모니터링 ----------
infra:
  health-monitor:
    # InfraHealthMonitorScheduler: /api/health?deep=true 를 이 주기로 폴링해서
    # 상태 전환(UP<->DOWN) 시점에만 OpsAlertNotifier로 알린다.
    interval-ms: ${INFRA_HEALTH_MONITOR_INTERVAL_MS:5000}
