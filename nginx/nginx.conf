worker_processes auto;

events {
    worker_connections 8192;
}

http {
    # zone 없이 max_fails/fail_timeout만 쓰면 각 워커 프로세스가 실패 카운트를 자기
    # 메모리에만 따로 들고 있어서, 워커마다 "이 서버가 죽었다"는 판단이 제각각·지연되게
    # 내려진다(2026-08-28 장애 주입 테스트에서 실측). zone으로 공유 메모리를 주면 워커 하나가
    # max_fails에 도달하는 즉시 전체 워커가 동시에 그 서버를 죽은 걸로 간주한다.
    upstream backend {
        zone backend_zone 64k;
        server app1:8080 max_fails=3 fail_timeout=5s;
        server app2:8080 max_fails=3 fail_timeout=5s;
        server app3:8080 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 죽은 인스턴스로 배정된 요청은 다른 인스턴스로 즉시 재시도(클라이언트에 실패로
            # 안 보이게) — 단, POST(join/issue)는 서버가 이미 처리했을 수도 있어 재시도가
            # 위험할 수 있는데, 이 프로젝트는 join/issue 둘 다 원자적 Lua + 멱등 처리라 안전.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
        }
    }
}
