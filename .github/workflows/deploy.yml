name: Deploy to EC2

# main에 푸시되면 테스트 통과 후 EC2 단일 인스턴스(docker compose)에 자동 배포한다.
#
# 필요한 저장소 시크릿(Settings > Secrets and variables > Actions > Secrets):
#   EC2_HOST     배포 대상 EC2의 퍼블릭 IP/도메인
#   EC2_SSH_KEY  배포 전용 SSH 개인키(ed25519) 전체 내용
#
# 선택적 저장소 변수(Settings > Secrets and variables > Actions > Variables) — 없으면 기본값 사용:
#   EC2_USER     접속 계정 (기본값: ubuntu)
#   EC2_APP_DIR  EC2 위 배포 디렉터리 (기본값: ~/app)
#
# EC2 쪽 전제조건(최초 1회 수동 설정, 이 워크플로가 매번 덮어쓰지 않음):
#   - Docker + Docker Compose plugin 설치
#   - ~/.ssh/authorized_keys 에 위 EC2_SSH_KEY의 공개키 등록
#   - ~/app/.env 에 실제 운영값 배치(git에는 올리지 않으므로 이 워크플로가 건드리지 않는다)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # [1단계] 테스트 통과 확인 — 여기서 실패하면 배포 자체가 진행되지 않는다.
  # docker-compose.yml의 mysql/redis/kafka를 그대로 띄운다(로컬 개발과 동일 조건).
  # 이유: @SpringBootTest 테스트 중 하나(CouponIssueConcurrencyTest)가 실제 StringRedisTemplate로
  # Redis 키를 조작하고, Flyway가 기동 시 실제 MySQL에 마이그레이션을 적용해야 컨텍스트가 뜬다 —
  # 즉 MySQL/Redis 없이는 컨텍스트 로딩 자체가 실패한다(2026-09-03 로컬 실측으로 확인).
  test:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_pw
      MYSQL_DATABASE: coupon_db
      MYSQL_USER: coupon_ci
      MYSQL_PASSWORD: coupon_ci_pw
    steps:
      - uses: actions/checkout@v5

      # Dockerfile(eclipse-temurin:21-jdk)과 벤더를 맞춘다 — CI와 실제 이미지 빌드 환경의
      # JDK 벤더가 다르면 미묘한 차이로 "CI는 되는데 이미지 빌드는 실패"가 생길 수 있다.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 인프라 기동 (MySQL/Redis/Kafka)
        run: docker compose up -d --wait mysql redis kafka

      - name: 테스트 실행
        run: |
          chmod +x ./gradlew
          ./gradlew test --console=plain
        env:
          DB_HOST: localhost
          MYSQL_PORT: 3306
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: 실패 시 인프라 로그 덤프
        if: failure()
        run: docker compose logs mysql redis kafka --tail=200

  # [2단계] EC2 서버 배포 — test 잡이 성공했을 때만 실행된다.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 프론트는 CI에서 미리 빌드해서 정적 파일만 넘긴다 — EC2에는 Node를 안 둔다.
      # VITE_API_BASE는 비워둔 채로 빌드(기본값) — nginx가 /api를 같은 오리진에서 프록시하므로
      # 프론트는 절대경로 없이 상대경로(/api/...)로 호출한다(frontend/src/lib/api.js 참고).
      - name: 프론트 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build
          echo "빌드 산출물:"
          ls -la dist/

      # 배포에 필요한 최소 파일만 묶는다. .env는 절대 포함하지 않는다 —
      # EC2에 이미 있는 운영용 .env를 덮어쓰면 안 되기 때문이다.
      - name: 배포 번들 패키징
        run: |
          mkdir -p deploy/web/dist
          cp -r frontend/dist/. deploy/web/dist/
          tar -czf deploy.tar.gz \
            src build.gradle settings.gradle gradlew gradle \
            Dockerfile docker-compose.yml docker-compose.deploy.yml scripts deploy
          echo "번들 크기:"
          ls -lh deploy.tar.gz

      - name: EC2로 전송 및 재기동
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          # 저장소 변수(vars)로 오버라이드 가능, 없으면 기본값 사용 — 인스턴스/경로가
          # 바뀌어도 이 워크플로 파일 자체는 안 건드려도 되게 하기 위함.
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '~/app' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key deploy.tar.gz "$EC2_USER@$EC2_HOST:/tmp/deploy.tar.gz"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "
            set -e
            mkdir -p $EC2_APP_DIR
            tar -xzf /tmp/deploy.tar.gz -C $EC2_APP_DIR
            rm -f /tmp/deploy.tar.gz
            cd $EC2_APP_DIR
            sudo docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
            sudo docker image prune -f
          "

      - name: 헬스체크
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/health" || true)
            [ "$code" = "200" ] && echo "배포 확인 완료 (health=$code)" && exit 0
            sleep 5
          done
          echo "헬스체크 실패 — 배포 후 API가 응답하지 않습니다" >&2
          exit 1
