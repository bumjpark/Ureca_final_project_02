<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .note { border: 1px dashed #a1a1aa; background: #f4f4f5; padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #52525b; line-height: 1.5; }
    .note b { display:block; color:#18181b; font-size:12px; margin-bottom:2px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }

    td { padding:12px; border-bottom:1px solid #f4f4f5; color:#3f3f46; }
    .badge { display:inline-block; padding: 3px 8px; font-size: 11px; border-radius: 4px; }
    .badge.live { background:#18181b; color:#fff; }
    .badge.soon { background:#e4e4e7; color:#3f3f46; }

        </thead>
        <tbody>
          <tr>
            <td>#12</td>
            <td>여름 시즌 정률 할인 쿠폰</td>
            <td>RATE 20%</td>
            <td>10,000</td>
            <td>2026-08-20 12:00</td>
            <td><span class="badge live">진행중</span></td>
            <td style="color:#71717a; font-size:12px;">수정 · 삭제</td>
          </tr>
          <tr>
            <td>#13</td>
            <td>신규 가입 정액 할인 쿠폰</td>
            <td>FIXED 3,000원</td>
            <td>5,000</td>
            <td>2026-08-25 10:00</td>
            <td><span class="badge soon">오픈 예정</span></td>
            <td style="color:#71717a; font-size:12px;">수정 · 삭제</td>
          </tr>
          <tr>
            <td>#11</td>
            <td>런칭 기념 쿠폰</td>
            <td>RATE 10%</td>
            <td>2,000</td>
            <td>2026-08-11 00:00</td>
            <td><span class="badge done">마감</span></td>
            <td style="color:#71717a; font-size:12px;">수정 · 삭제</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
