        </div>

        <div style="display:flex; gap:12px; margin-top:16px;">

            <div style="font-size:11px; color:#a1a1aa; margin-bottom:6px;">발급 완료</div>
            <div style="font-size:20px; font-weight:700; color:#18181b;">6,786</div>
          </div>
          <div class="stat">
            <div style="font-size:11px; color:#a1a1aa; margin-bottom:6px;">잔여 수량</div>
            <div style="font-size:20px; font-weight:700; color:#18181b;">3,214</div>
          </div>
          <div class="stat">
            <div style="font-size:11px; color:#a1a1aa; margin-bottom:6px;">Redis RESERVED</div>
            <div style="font-size:20px; font-weight:700; color:#18181b;">6,791</div>
          </div>
        </div>
      </div>

      <div style="flex:1; border:1px dashed #d4d4d8; border-radius:8px; display:flex; align-items:center; justify-content:center; text-align:center; color:#a1a1aa; font-size:12px; padding:20px;">
        [시간대별 발급 추이 그래프 영역]
      </div>
    </div>

    <div style="font-size:11px; color:#a1a1aa;">10초마다 자동 갱신됩니다 · Redis RESERVED와 DB 발급 완료 수의 차이가 정합성 검증 대상입니다</div>
  </div>
