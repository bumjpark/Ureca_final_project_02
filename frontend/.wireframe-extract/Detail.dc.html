<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .note { border: 1px dashed #a1a1aa; background: #f4f4f5; padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #52525b; line-height: 1.5; }
    .note b { display:block; color:#18181b; font-size:12px; margin-bottom:2px; }
    .badge.live { display:inline-block; padding: 3px 8px; font-size: 11px; border-radius: 4px; background:#18181b; color:#fff; }
    .field { display:flex; justify-content:space-between; font-size:13px; padding:12px 0; border-bottom:1px solid #f4f4f5; color:#3f3f46; }
    .field span:first-child { color:#a1a1aa; }
    .field:last-child { border-bottom:none; }
    .btn-disabled { background:#e4e4e7; color:#a1a1aa; border:1px solid #d4d4d8; }
  </style>
</helmet>
<div style="width:960px; min-height:640px; background:#fff; box-sizing:border-box; display:flex; flex-direction:column;">
  <div class="note" style="border-radius:0;">
    <b>[사용자] 쿠폰 상세 / 오픈 대기</b>
    API: GET /api/admin/coupon-policies/{policyId}
  </div>

  <div style="padding:24px; display:flex; flex-direction:column; gap:18px; flex-grow:1;">
    <div style="font-size:13px; color:#71717a;">&lt; 목록으로</div>

    <div>
      <span class="badge live">진행중</span>
      <div style="font-size:22px; font-weight:700; color:#18181b; margin-top:10px;">여름 시즌 정률 할인 쿠폰</div>
    </div>

    <div style="display:flex; gap:16px; flex-grow:1;">
      <div style="flex:1.2; border:1px solid #d4d4d8; border-radius:8px; padding:4px 18px; align-self:flex-start;">
        <div class="field"><span>할인 내용</span><span>20% 할인 (최대 5,000원)</span></div>
        <div class="field"><span>총 발행 수량</span><span>10,000장</span></div>
        <div class="field"><span>오픈 일시</span><span>2026-08-20 12:00</span></div>
        <div class="field"><span>마감 일시</span><span>2026-08-27 23:59</span></div>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; gap:16px;">
        <div style="border:1px dashed #d4d4d8; border-radius:8px; padding:24px; text-align:center;">
          <div style="font-size:12px; color:#a1a1aa; margin-bottom:8px;">오픈까지 남은 시간</div>
          <div style="font-size:32px; font-weight:700; color:#18181b; letter-spacing:1px;">00 : 12 : 47</div>
        </div>
        <button class="btn-disabled" style="padding:16px; font-size:15px; font-weight:600; border-radius:6px;">발급받기 (오픈 전)</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
