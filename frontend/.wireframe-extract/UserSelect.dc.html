<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .note { border: 1px dashed #a1a1aa; background: #f4f4f5; padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #52525b; line-height: 1.5; }
    .note b { display:block; color:#18181b; font-size:12px; margin-bottom:2px; }
    input { box-sizing:border-box; border:1px solid #d4d4d8; border-radius:6px; padding:10px 12px; font-size:13px; color:#3f3f46; font-family:inherit; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:#a1a1aa; font-weight:600; font-size:11px; padding:10px 12px; border-bottom:1px solid #e4e4e7; }
    td { padding:12px; border-bottom:1px solid #f4f4f5; color:#3f3f46; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    .radio { width:16px; height:16px; border-radius:50%; border:1.5px solid #a1a1aa; flex-shrink:0; }
    .radio.on { border-color:#18181b; position:relative; }
    .radio.on::after { content:""; position:absolute; inset:3px; border-radius:50%; background:#18181b; }
  </style>
</helmet>
<div style="width:960px; min-height:640px; background:#fff; box-sizing:border-box; display:flex; flex-direction:column;">
  <div class="note" style="border-radius:0;">
    <b>[사용자] 사용자 선택 (userId 선택)</b>
    API: 전용 조회 API 명시 없음 — DB 더미 users(100만 건) 중 검색/선택 (구현 시 확인 필요, 예: GET /api/users?search=)
  </div>

  <div style="padding:24px; display:flex; flex-direction:column; gap:18px; flex-grow:1;">
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <div style="font-size:13px; color:#71717a;">&lt; 역할 선택</div>
        <div style="font-size:19px; font-weight:700; color:#18181b; margin-top:4px;">사용자 선택</div>
        <div style="font-size:12px; color:#a1a1aa; margin-top:4px;">더미 회원 100만 건 중 하나를 선택해주세요</div>
      </div>
      <input type="text" placeholder="이름 또는 이메일로 검색" style="width:280px;">
    </div>

    <div style="border:1px solid #d4d4d8; border-radius:8px; overflow:hidden;">
      <table>
        <thead>
          <tr><th style="width:40px;"></th><th>이름</th><th>이메일</th><th>회원 ID</th></tr>
        </thead>
        <tbody>
          <tr style="background:#fafafa;">
            <td><div class="radio on"></div></td>
            <td style="font-weight:600; color:#18181b;">홍*동</td>
            <td style="color:#a1a1aa;">hong****@example.com</td>
            <td style="color:#a1a1aa;">100234</td>
          </tr>
          <tr>
            <td><div class="radio"></div></td>
            <td style="font-weight:600; color:#18181b;">김*수</td>
            <td style="color:#a1a1aa;">kim****@example.com</td>
            <td style="color:#a1a1aa;">100235</td>
          </tr>
          <tr>
            <td><div class="radio"></div></td>
            <td style="font-weight:600; color:#18181b;">이*영</td>
            <td style="color:#a1a1aa;">lee****@example.com</td>
            <td style="color:#a1a1aa;">100236</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="flex-grow:1;"></div>

    <div style="display:flex; justify-content:flex-end;">
      <button style="padding:12px 28px; font-size:14px; font-weight:600; border-radius:6px; border:none; background:#18181b; color:#fff;">이 사용자로 시작하기</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
