<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .note { border: 1px dashed #a1a1aa; background: #f4f4f5; padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #52525b; line-height: 1.5; }
    .note b { display:block; color:#18181b; font-size:12px; margin-bottom:2px; }
    label { font-size:12px; color:#71717a; display:block; margin-bottom:6px; }
    input, select { width:100%; box-sizing:border-box; border:1px solid #d4d4d8; border-radius:6px; padding:10px 12px; font-size:13px; color:#3f3f46; font-family:inherit; }
    .fld { display:flex; flex-direction:column; }
    .radio { display:flex; gap:16px; align-items:center; }
    .radio label { display:flex; align-items:center; gap:6px; font-size:13px; color:#3f3f46; margin:0; }
  </style>
</helmet>
<div style="width:960px; min-height:640px; background:#fff; box-sizing:border-box; display:flex; flex-direction:column;">
  <div class="note" style="border-radius:0;">
    <b>[관리자] 쿠폰 정책 생성 / 수정 폼</b>
    API: POST /api/admin/coupon-policies, PATCH /api/admin/coupon-policies/{policyId}
  </div>

  <div style="padding:24px; max-width:640px;">
    <div style="font-size:19px; font-weight:700; color:#18181b; margin-bottom:20px;">쿠폰 정책 생성</div>

    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="fld">
        <label>쿠폰명 (title)</label>
        <input type="text" value="여름 시즌 정률 할인 쿠폰">
      </div>

      <div class="fld">
        <label>할인 유형 (coupon_type)</label>
        <div class="radio">
          <label><input type="radio" name="type" checked style="width:auto;">정률 (RATE)</label>
          <label><input type="radio" name="type" style="width:auto;">정액 (FIXED)</label>
        </div>
      </div>

      <div style="display:flex; gap:16px;">
        <div class="fld" style="flex:1;">
          <label>할인 값 (discount_value)</label>
          <input type="text" value="20">
        </div>
        <div class="fld" style="flex:1;">
          <label>총 발행 수량 (total_quantity)</label>
          <input type="text" value="10000">
        </div>
      </div>

      <div style="display:flex; gap:16px;">
        <div class="fld" style="flex:1;">
          <label>오픈 일시 (open_at)</label>
          <input type="text" value="2026-08-20 12:00">
        </div>
        <div class="fld" style="flex:1;">
          <label>마감 일시 (close_at, 선택)</label>
          <input type="text" value="2026-08-27 23:59">
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button style="flex:1; padding:14px; font-size:14px; font-weight:600; border-radius:6px; border:none; background:#18181b; color:#fff;">저장</button>
        <button style="flex:1; padding:14px; font-size:14px; border-radius:6px; border:1px solid #d4d4d8; background:#fff; color:#52525b;">취소</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
