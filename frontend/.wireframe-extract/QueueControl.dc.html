<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .note { border: 1px dashed #a1a1aa; background: #f4f4f5; padding: 8px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #52525b; line-height: 1.5; }
    .note b { display:block; color:#18181b; font-size:12px; margin-bottom:2px; }
    .stat { border:1px solid #d4d4d8; border-radius:6px; padding:16px; flex:1; }
    label { font-size:12px; color:#71717a; display:block; margin-bottom:6px; }
    input { box-sizing:border-box; border:1px solid #d4d4d8; border-radius:6px; padding:10px 12px; font-size:13px; color:#3f3f46; font-family:inherit; }
  </style>
</helmet>
<div style="width:960px; min-height:640px; background:#fff; box-sizing:border-box; display:flex; flex-direction:column;">
  <div class="note" style="border-radius:0;">
    <b>[관리자] 대기열 제어 패널</b>
    API: PATCH /api/admin/queue/limit
  </div>

  <div style="padding:24px; max-width:640px; display:flex; flex-direction:column; gap:20px;">
    <div style="font-size:19px; font-weight:700; color:#18181b;">대기열 제어</div>

    <div style="display:flex; gap:12px;">
      <div class="stat">
        <div style="font-size:11px; color:#a1a1aa; margin-bottom:6px;">현재 대기 인원</div>
        <div style="font-size:20px; font-weight:700; color:#18181b;">1,482명</div>
      </div>
      <div class="stat">
        <div style="font-size:11px; color:#a1a1aa; margin-bottom:6px;">현재 처리 limit</div>
        <div style="font-size:20px; font-weight:700; color:#18181b;">500 / 분</div>
      </div>
    </div>

    <div style="border:1px solid #d4d4d8; border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:12px;">
      <label>처리 limit 조정 (건 / 분)</label>
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="flex-grow:1; height:6px; background:#e4e4e7; border-radius:3px; position:relative;">
          <div style="position:absolute; left:0; top:0; bottom:0; width:50%; background:#18181b; border-radius:3px;"></div>
        </div>
        <input type="text" value="500" style="width:80px; text-align:center;">
      </div>
      <button style="align-self:flex-end; padding:10px 18px; font-size:13px; font-weight:600; border-radius:6px; border:none; background:#18181b; color:#fff;">적용</button>
    </div>

    <div style="font-size:11px; color:#a1a1aa;">변경 사항은 즉시 반영되며 Redis 런타임 설정에 저장됩니다 (DB 테이블 없음)</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
