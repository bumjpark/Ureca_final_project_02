# 즉시 버스트(수만 개 동시 접속) 처리 성능 검증용 다중 인스턴스 오버레이.
# 기본 docker-compose.yml의 `app` 서비스는 안 띄우고, 대신 이 파일의 app1/app2/app3 +
# nginx(라운드로빈)를 띄운다:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale-test.yml \
#     up -d --build mysql redis kafka kafka-ui app1 app2 app3 nginx
#
# k6는 http://app:8080 대신 http://nginx:8080을 때려야 한다:
#
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml \
#     -f docker-compose.scale-test.yml --profile loadtest run --rm \
#     -e BASE_URL=http://nginx:8080 k6 run /scripts/burst-20k.js
#
# 대기열/재고는 전부 Redis에 중앙화돼 있어서(coupon:policy:{id}:* 키) 인스턴스가 몇 개든
# 선착순 정합성은 그대로 보장된다 — 이 오버레이는 순수하게 "누가 순간 동시접속을 받아내는가"만
# 3대로 나누는 것.
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    SERVER_PORT: 8080
    TZ: Asia/Seoul
    DB_HOST: mysql
    MYSQL_PORT: 3306
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    DB_HIKARI_MAX_POOL_SIZE: ${DB_HIKARI_MAX_POOL_SIZE:-20}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s
  networks:
    - coupon-network

services:
  app1:
    <<: *app-common
    container_name: coupon-app-1
    ports:
      - "8081:8080" # 직접 디버깅용(선택) — 실제 트래픽은 전부 nginx:8080 경유

  app2:
    <<: *app-common
    container_name: coupon-app-2
    ports:
      - "8082:8080"

  app3:
    <<: *app-common
    container_name: coupon-app-3
    ports:
      - "8083:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: coupon-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - coupon-network
